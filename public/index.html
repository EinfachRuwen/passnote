<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Notizen</title>
    <link rel="stylesheet" href="/assets/zettel.css?v=2">
    <link rel="icon" href="data:,">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FDFCF8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Notizen">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body class="start-page">
    <div class="start">
        <div class="card paper">
            <div class="brand">PassNote</div>
            <p>Zettelchen schreiben, mit dem Pencil, sieht aus wie Mitschrift.</p>

            <label class="small-label" for="name">Dein Name</label>
            <input class="field" id="name" maxlength="20" placeholder="z.B. Alex" autocomplete="off" autocapitalize="words">

            <form id="join-form">
                <label class="small-label" for="code">Code von deinem Banknachbarn</label>
                <input class="field" id="code" placeholder="z.B. calm-moon-42" autocomplete="off" autocapitalize="off" spellcheck="false">
                <input class="field hidden" type="password" id="join-password" placeholder="Passwort" autocomplete="off">
                <div class="error hidden" id="join-error"></div>
                <button class="btn primary" type="submit" id="join-btn">Aufschlagen</button>
            </form>

            <div class="divider-text">oder</div>

            <form id="create-form">
                <details>
                    <summary>mit Passwort schützen</summary>
                    <input class="field" type="password" id="create-password" placeholder="Passwort (optional)" autocomplete="new-password">
                </details>
                <div class="error hidden" id="create-error"></div>
                <button class="btn" type="submit" id="create-btn">Neuen Block anfangen</button>
            </form>

            <div id="recent-wrap" class="hidden">
                <label class="small-label">Zuletzt</label>
                <ul class="recent" id="recent"></ul>
            </div>
            <p class="legal-links"><a href="https://focusonruwen.com/impressum" target="_blank" rel="noopener">Impressum</a> · <a href="https://focusonruwen.com/datenschutz" target="_blank" rel="noopener">Datenschutz</a></p>
        </div>
    </div>
    <script src="/assets/start.js?v=1"></script>
</body>
</html>
