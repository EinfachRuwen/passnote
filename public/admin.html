<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassNote Admin Dashboard</title>
    <link rel="stylesheet" href="/assets/style.css?v=8">
    <meta name="theme-color" content="#1e293b">
</head>
<body class="admin-page">
    <div id="login-view" class="admin-view">
        <div class="admin-card login-card">
            <div class="login-header">
                <span class="icon">🔒</span>
                <h2>Admin Login</h2>
            </div>
            <form id="admin-login-form">
                <div class="input-group">
                    <input type="password" id="admin-password" placeholder="Administrator Passwort" required>
                </div>
                <div id="login-error" class="error-message hidden">Zugriff verweigert.</div>
                <button type="submit" class="primary-btn btn-block">Dashboard öffnen</button>
            </form>
        </div>
    </div>

    <div id="dashboard-view" class="admin-view hidden">
        <nav class="admin-nav">
            <div class="nav-brand">
                <span class="logo-icon">📝</span>
                <h2>PassNote <span class="badge badge-admin">Admin</span></h2>
            </div>
            <button id="logout-btn" class="secondary-btn btn-sm">Logout</button>
        </nav>

        <main class="admin-main">
            <!-- Stats Row -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <div class="stat-value" id="stat-total">0</div>
                        <div class="stat-label">Räume Gesamt</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-info">
                        <div class="stat-value" id="stat-active">0</div>
                        <div class="stat-label">Aktive Nutzer</div>
                    </div>
                </div>
            </div>

            <div class="admin-content-grid">
                <!-- Create Room -->
                <section class="admin-card">
                    <div class="card-header">
                        <h3>✨ Neuer Raum</h3>
                    </div>
                    <form id="create-room-form" class="create-room-form">
                        <div class="form-group">
                            <label>Raum URL (Slug)</label>
                            <input type="text" id="new-slug" name="slug" placeholder="Wird autogeneriert wenn leer">
                        </div>
                        <div class="form-group">
                            <label>Anzeigename</label>
                            <input type="text" id="new-name" name="name" placeholder="z.B. Mathe Klasse 9a">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Lebensdauer</label>
                                <select id="new-type" name="type">
                                    <option value="temporary">Temporär (7 Tage)</option>
                                    <option value="permanent">Permanent</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Nutzerlimit</label>
                                <input type="number" id="new-max-users" name="maxUsers" placeholder="50" value="50">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Passwort (Optional)</label>
                            <input type="password" id="new-password" name="password" placeholder="Leer lassen für offene Räume">
                        </div>
                        <button type="submit" class="primary-btn btn-block">Raum erstellen</button>
                    </form>
                </section>

                <!-- Room List -->
                <section class="admin-card room-list-card">
                    <div class="card-header">
                        <h3>📂 Alle Räume</h3>
                        <button class="icon-btn" onclick="loadRooms()" title="Aktualisieren">🔄</button>
                    </div>
                    <div class="table-container">
                        <table id="rooms-table" class="modern-table">
                            <thead>
                                <tr>
                                    <th>Raum</th>
                                    <th>Typ</th>
                                    <th>Nutzer</th>
                                    <th>Aktivität</th>
                                    <th>Aktionen</th>
                                </tr>
                            </thead>
                            <tbody id="rooms-tbody">
                                <!-- Rows via JS -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- QR Modal -->
    <div id="admin-qr-modal" class="modal hidden">
        <div class="modal-content glass-modal">
            <h3 id="admin-qr-title">Raum beitreten</h3>
            <div id="admin-qr-container" class="qr-wrapper"></div>
            <button id="admin-close-qr" class="secondary-btn btn-block">Schließen</button>
        </div>
    </div>

    <script src="/assets/admin.js?v=8"></script>
</body>
</html>
